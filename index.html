<script>
// ═══════════════════════════════════════════════════
// STATE + THEME
// ═══════════════════════════════════════════════════
var APP={mode:'leftmost',speed:600,zoom:1,aSteps:null,aNT:null,aIdx:0,aTimer:null,aPlay:false};
var DARK_ACTIVE=false;
function toggleTheme(){
  DARK_ACTIVE=!DARK_ACTIVE;
  if(DARK_ACTIVE){
    document.documentElement.style.setProperty('--paper','#131008');
    document.documentElement.style.setProperty('--paper2','#1a1509');
    document.documentElement.style.setProperty('--paper3','#22190a');
    document.documentElement.style.setProperty('--ink','#f0ead8');
    document.documentElement.style.setProperty('--ink2','#d4cbb5');
    document.documentElement.style.setProperty('--ink3','#907e65');
    document.documentElement.style.setProperty('--ink4','#5a4e3a');
    document.documentElement.style.setProperty('--rule','#2e2515');
    document.documentElement.style.setProperty('--grid','rgba(200,185,160,.06)');
    document.documentElement.style.setProperty('--nt','#6ba3d6');
    document.documentElement.style.setProperty('--term','#6bc97e');
    document.getElementById('themeBtn').textContent='☀ Theme';
  }else{
    document.documentElement.style.setProperty('--paper','#f5f0e8');
    document.documentElement.style.setProperty('--paper2','#ede8dc');
    document.documentElement.style.setProperty('--paper3','#e0d9cc');
    document.documentElement.style.setProperty('--ink','#1a1410');
    document.documentElement.style.setProperty('--ink2','#3d3530');
    document.documentElement.style.setProperty('--ink3','#7a6e65');
    document.documentElement.style.setProperty('--ink4','#b0a89e');
    document.documentElement.style.setProperty('--rule','#c8bfb0');
    document.documentElement.style.setProperty('--grid','rgba(100,90,80,.09)');
    document.documentElement.style.setProperty('--nt','#1a3a5c');
    document.documentElement.style.setProperty('--term','#1a4a2e');
    document.getElementById('themeBtn').textContent='◑ Theme';
  }
}

// ═══════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded',function(){
  document.getElementById('seg-leftmost').addEventListener('click',function(){setMode('leftmost',this);});
  document.getElementById('seg-rightmost').addEventListener('click',function(){setMode('rightmost',this);});
  document.getElementById('seg-both').addEventListener('click',function(){setMode('both',this);});
  document.getElementById('spd-slow').addEventListener('click',function(){setSpeed(600,this);});
  document.getElementById('spd-normal').addEventListener('click',function(){setSpeed(300,this);});
  document.getElementById('spd-fast').addEventListener('click',function(){setSpeed(100,this);});
  document.querySelectorAll('.tab').forEach(function(t){t.addEventListener('click',function(){switchTab(this.dataset.t);});});
  document.getElementById('inputString').addEventListener('input',updateTokens);
  updateTokens();
});

function setMode(m,btn){APP.mode=m;document.querySelectorAll('.sb').forEach(function(b){b.classList.remove('on');});btn.classList.add('on');}
function setSpeed(s,btn){APP.speed=s;document.querySelectorAll('.spdb').forEach(function(b){b.classList.remove('on');});btn.classList.add('on');}

// ═══════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function showErr(msg){var b=document.getElementById('errBox');if(!msg){b.style.display='none';return;}b.textContent=msg;b.style.display='block';}
function updateTokens(){
  var v=document.getElementById('inputString').value.trim();
  var b=document.getElementById('tokBox');
  if(!v){b.innerHTML='<span style="font-size:.65rem;color:var(--ink4);font-family:var(--mono)">ε (empty string)</span>';return;}
  b.innerHTML=v.split('').map(function(c){return'<span class="tk">'+esc(c)+'</span>';
